<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>How Reveille fits: a local Git repository goes in; an HTML report for people and JSON or CSV for programs come out.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6e7681"/></marker></defs>
<rect width="900" height="250" fill="#0d1117"/>
<rect x="20" y="67" width="200" height="116" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="38" y="97" font-size="15" font-weight="600" fill="#e6edf3">Git repository</text>
<text x="38" y="123" font-size="13" fill="#9198a1">on your machine</text>
<text x="38" y="143" font-size="13" fill="#9198a1">history, author names</text>
<text x="38" y="163" font-size="13" fill="#9198a1">and email addresses</text>
<line x1="222" y1="125" x2="278" y2="125" stroke="#6e7681" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="280" y="40" width="300" height="170" rx="8" fill="#161b22" stroke="#4f8fe8" stroke-width="2"/>
<text x="298" y="70" font-size="15" font-weight="600" fill="#e6edf3">reveille</text>
<text x="298" y="96" font-size="13" fill="#9198a1">reads commit metadata and</text>
<text x="298" y="116" font-size="13" fill="#9198a1">per-file line counts only</text>
<text x="298" y="136" font-size="13" fill="#9198a1">makes no network calls</text>
<text x="298" y="156" font-size="13" fill="#9198a1">never changes Git data</text>
<text x="298" y="176" font-size="13" fill="#9198a1">repeatable with --deterministic</text>
<line x1="582" y1="95" x2="638" y2="70" stroke="#6e7681" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="582" y1="155" x2="638" y2="180" stroke="#6e7681" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="640" y="20" width="240" height="90" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="658" y="50" font-size="15" font-weight="600" fill="#e6edf3">HTML report</text>
<text x="658" y="76" font-size="13" fill="#9198a1">one self-contained file</text>
<text x="658" y="96" font-size="13" fill="#9198a1">for people</text>
<rect x="640" y="140" width="240" height="90" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="658" y="170" font-size="15" font-weight="600" fill="#e6edf3">JSON or CSV</text>
<text x="658" y="196" font-size="13" fill="#9198a1">JSON has a schema version</text>
<text x="658" y="216" font-size="13" fill="#9198a1">for scripts and AI assistants</text>
</svg>
