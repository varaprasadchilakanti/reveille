# ==================================================================
# Reveille -- Git Repository Intelligence
# CLI tool for generating self-contained HTML performance reports
# from local Git repositories.
# ==================================================================

[tool.poetry]
name = "reveille"
version = "0.8.0"
description = "A CLI tool that generates self-contained HTML performance reports from local Git repositories."
authors = ["Varaprasad Chilakanti <varaprasadchilakanti@gmail.com>"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/varaprasadchilakanti/reveille"
repository = "https://github.com/varaprasadchilakanti/reveille"
documentation = "https://github.com/varaprasadchilakanti/reveille#readme"
keywords = [
    "git",
    "analytics",
    "reporting",
    "cli",
    "dashboard",
    "contributors",
    "devtools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    # PEP 639 deprecates licence classifiers in favour of a `License-Expression`
    # SPDX field. The pinned Poetry 2.4.2 supports it and now warns about this
    # classifier, so the blocker is no longer the toolchain -- it is that the
    # migration means moving the whole of `[tool.poetry]` to the PEP 621
    # `[project]` table, which is a packaging change of its own and does not
    # belong in a release already carrying a relicensing. Dropping the
    # classifier without adding the expression would leave the distribution
    # with no structured licence metadata at all. The SPDX identifier is
    # `Apache-2.0`.
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
    "Typing :: Typed",
]
packages = [
    { include = "reveille", from = "src" },
]


# ------------------------------------------------------------------
# RUNTIME DEPENDENCIES
# ------------------------------------------------------------------

[tool.poetry.dependencies]
# Floor is a real technical constraint, not a preference: config.py imports
# tomllib and git_reader.py uses datetime.UTC, both added in 3.11.
# Deliberately no upper cap below 4.0 — see CONTRIBUTING.md,
# "Supported Python versions", for why capping is not done here.
python = "^3.11"

# CLI Layer
# Typer 0.18.0 restored full Click 8.3.x compatibility. The <8.3.0 upper
# bound introduced in v0.3.0 is no longer required.
#
# Deliberately no `extras = ["all"]`. Typer declares no extras at any
# version in this range, so pip emitted "typer X does not provide the
# extra 'all'" on every install. It was never load-bearing: `rich` and
# `shellingham` -- what the extra used to pull -- are ordinary
# dependencies of `typer` itself. `typer-slim` is the variant that omits
# them, and Reveille does not use it.
typer = ">=0.18,<0.28"
click = ">=8.0.0"

# Git Data Layer
gitpython = "^3.1.40"

# Templating
jinja2 = "^3.1.0"

# Charts -- self-contained JS bundle embedded in output HTML
plotly = ">=5.20,<8.0"

# Data Validation & Settings
pydantic = "^2.0"
pydantic-settings = "^2.0"

# Date & Time Utilities
python-dateutil = "^2.9.0"


# ------------------------------------------------------------------
# DEVELOPMENT DEPENDENCIES
# ------------------------------------------------------------------

[tool.poetry.group.dev]
optional = false

[tool.poetry.group.dev.dependencies]

# Testing Framework
pytest = ">=8,<10"
pytest-cov = ">=5,<8"
pytest-xdist = "^3.5.0"
pytest-timeout = "^2.3.0"

# Type Checking
mypy = ">=1.8,<3.0"
types-python-dateutil = "^2.9.0"

# Linting & Formatting
ruff = ">=0.4.0"

# Pre-commit Hooks
pre-commit = ">=3.6,<5.0"


# ------------------------------------------------------------------
# CLI ENTRY POINT
# ------------------------------------------------------------------

[tool.poetry.scripts]
reveille = "reveille.cli:app"


# ------------------------------------------------------------------
# BUILD SYSTEM
# ------------------------------------------------------------------

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"


# ==================================================================
# TOOL CONFIGURATIONS
# ==================================================================


# ------------------------------------------------------------------
# RUFF -- Linting & Formatting
# ------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "D",    # pydocstyle
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in argument defaults
    "D100",  # missing docstring in public module
    "D104",  # missing docstring in public package
    "D203",  # blank line before class docstring (conflicts with D211)
    "D213",  # multi-line summary second line (conflicts with D212)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/**/*.py" = ["S101", "D"]

[tool.ruff.lint.mccabe]
# Stated rather than inherited. The `C` selector already enables C901 through
# mccabe -- it caught three genuine cases during the 0.8.0 work, each of which
# was resolved by extracting a function rather than by raising the ceiling. The
# limit is a contract, so it should not depend on a tool default that can move.
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["reveille"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]


# ------------------------------------------------------------------
# MYPY -- Type Checking (strict mode)
# ------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "git.*",
    "plotly.*",
]
ignore_missing_imports = true


# ------------------------------------------------------------------
# PYTEST
# ------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--verbose",
    "--strict-markers",
    "--strict-config",
]
timeout = 120
markers = [
    "unit: Unit tests -- no I/O, no filesystem, no subprocess",
    "integration: Integration tests -- real Git repositories via fixtures",
    "e2e: End-to-end tests -- full CLI invocation against a fixture repository",
    "slow: Tests with non-trivial runtime",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::ResourceWarning",
    "ignore::coverage.exceptions.CoverageWarning",
]


# ------------------------------------------------------------------
# COVERAGE
# ------------------------------------------------------------------

[tool.coverage.run]
source = ["src/reveille"]
branch = true
parallel = true
data_file = ".coverage"
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
precision = 2
show_missing = true

fail_under = 90

exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"


# ==================================================================
# END OF CONFIGURATION
# ==================================================================
