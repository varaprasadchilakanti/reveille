# ==================================================================
# Reveille -- offline reports of a Git repository's history
# CLI tool for reporting a local Git repository's commit activity.
# ==================================================================

[tool.poetry]
name = "reveille"
version = "0.9.0"
description = "Offline reports of a Git repository's commit activity, and repository summaries that never change Git data: an HTML report, plus repository state and what changed since a tag as JSON for scripts, CI and coding agents."
authors = ["Vara Prasad Chilakanti <varaprasadchilakanti@gmail.com>"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/varaprasadchilakanti/reveille"
repository = "https://github.com/varaprasadchilakanti/reveille"
documentation = "https://github.com/varaprasadchilakanti/reveille#readme"
keywords = [
    "git",
    "git-history",
    "git-status",
    "repository-summary",
    "commit-heatmap",
    "code-churn",
    "git-cli",
    "offline",
    "json",
    "cli",
    "ci",
    "ai-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    # PEP 639 deprecates licence classifiers in favour of a `License-Expression`
    # SPDX field, and Poetry now warns about this classifier. Moving to the
    # field means moving all of `[tool.poetry]` to the PEP 621 `[project]`
    # table, which is a separate packaging change. Dropping the classifier
    # without adding the expression would leave no structured licence metadata.
    # The SPDX identifier is `Apache-2.0`.
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
    "Typing :: Typed",
]
packages = [
    { include = "reveille", from = "src" },
]


# ------------------------------------------------------------------
# RUNTIME DEPENDENCIES
# ------------------------------------------------------------------

[tool.poetry.dependencies]
# Floor is a real technical constraint, not a preference: config.py imports
# tomllib and git_reader.py uses datetime.UTC, both added in 3.11.
# No upper cap below 4.0; see CONTRIBUTING.md,
# "Supported Python versions", for why capping is not done here.
python = "^3.11"

# CLI Layer
# Typer 0.18.0 restored Click 8.3.x compatibility, so no Click upper bound.
#
# No `extras = ["all"]`: Typer declares no extras in this range, and pip warns
# about a missing one. `rich` and `shellingham` are ordinary dependencies of
# `typer` itself; `typer-slim` omits them and Reveille does not use it.
typer = ">=0.18,<0.28"
click = ">=8.0.0"

# Git Data Layer
# Floor: 3.1.60 fixed repository content posing as the Git directory. No
# published advisory affects 3.1.62 (OSV, 2026-10-13).
gitpython = "^3.1.62"

# Templating
# Floor: no published advisory affects 3.1.6 (OSV, 2026-10-13).
jinja2 = "^3.1.6"

# Charts -- self-contained JS bundle embedded in output HTML
plotly = ">=5.20,<8.0"

# Data Validation
# Floor: no published advisory affects 2.4.0 (OSV, 2026-10-13).
pydantic = "^2.4"


# ------------------------------------------------------------------
# DEVELOPMENT DEPENDENCIES
# ------------------------------------------------------------------

[tool.poetry.group.dev]
optional = false

[tool.poetry.group.dev.dependencies]

# Testing Framework
pytest = ">=8,<10"
pytest-cov = ">=5,<8"
pytest-xdist = "^3.5.0"
pytest-timeout = "^2.3.0"

# Type Checking
mypy = ">=1.8,<3.0"

# Linting & Formatting
ruff = ">=0.16.9"

# Pre-commit Hooks
pre-commit = ">=3.6,<5.0"


# ------------------------------------------------------------------
# CLI ENTRY POINT
# ------------------------------------------------------------------

[tool.poetry.scripts]
reveille = "reveille.cli:app"
# A short name for the same command: two other projects install a `reveille` command too.
reile = "reveille.cli:app"


# ------------------------------------------------------------------
# BUILD SYSTEM
# ------------------------------------------------------------------

[build-system]
# Anyone building from the sdist resolves poetry-core by this constraint. 1.x
# emits Metadata 2.1 without `License-File` and ignores SOURCE_DATE_EPOCH, so it
# produces a different artefact from the one CI checks for reproducibility.
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"


# ==================================================================
# TOOL CONFIGURATIONS
# ==================================================================


# ------------------------------------------------------------------
# RUFF -- Linting & Formatting
# ------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "D",    # pydocstyle
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in argument defaults
    "D100",  # missing docstring in public module
    "D104",  # missing docstring in public package
    "D203",  # blank line before class docstring (conflicts with D211)
    "D213",  # multi-line summary second line (conflicts with D212)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/**/*.py" = ["S101", "D"]

[tool.ruff.lint.mccabe]
# Set explicitly: the `C` selector already enables C901 through mccabe, and the
# limit should not depend on a tool default that can change.
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["reveille"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]


# ------------------------------------------------------------------
# MYPY -- Type Checking (strict mode)
# ------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "git.*",
    "plotly.*",
]
ignore_missing_imports = true


# ------------------------------------------------------------------
# PYTEST
# ------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--verbose",
    "--strict-markers",
    "--strict-config",
]
timeout = 120
markers = [
    "unit: Unit tests -- no I/O, no filesystem, no subprocess",
    "integration: Integration tests -- real Git repositories via fixtures",
    "e2e: End-to-end tests -- full CLI invocation against a fixture repository",
    "slow: Tests with non-trivial runtime",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::ResourceWarning",
    "ignore::coverage.exceptions.CoverageWarning",
]


# ------------------------------------------------------------------
# COVERAGE
# ------------------------------------------------------------------

[tool.coverage.run]
source = ["src/reveille"]
branch = true
parallel = true
data_file = ".coverage"
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
precision = 2
show_missing = true

fail_under = 90

exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"


# ==================================================================
# END OF CONFIGURATION
# ==================================================================
