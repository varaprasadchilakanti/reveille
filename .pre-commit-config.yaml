# ==================================================================
# Reveille -- Pre-commit Hook Configuration
#
# Hooks run automatically on git commit against staged files.
# To run manually against the full codebase:
#   poetry run pre-commit run --all-files
#
# To install hooks into the local repository:
#   poetry run pre-commit install
#
# All hooks use repo: local so they execute inside the project's
# Poetry virtualenv, ensuring version parity with CI.
# ==================================================================
repos:
# ------------------------------------------------------------------
# General file hygiene
# ------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key

# ------------------------------------------------------------------
# Local hooks -- delegate to Poetry virtualenv for version parity
# with the CI pipeline.
# ------------------------------------------------------------------
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint)
        entry: poetry run ruff check src tests --fix
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-format
        name: ruff (format)
        entry: poetry run ruff format src tests
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: poetry run mypy src
        language: system
        types: [python]
        pass_filenames: false
