# ==================================================================
# Reveille -- Dependabot Configuration
#
# Weekly automated dependency update PRs for pip packages, GitHub Actions
# and the pre-commit hooks pinned in .pre-commit-config.yaml.
#
# Updates are grouped into one PR per ecosystem. Ungrouped, this opened up
# to five PRs per ecosystem per week. Each merge is a chance to hand-resolve
# a conflict in poetry.lock, and a hand-resolved conflict that keeps both
# sides can leave an invalid lock. Fewer merges means fewer such chances.
#
# Majors are grouped too rather than split out. The lock guards
# (.gitattributes `-merge`, `make check-lock`, the `lockfile` CI job) now
# catch the failure mode that made batching risky, and a single weekly PR
# that CI must pass is easier to review than five.
#
# Both ecosystems declare a seven-day `cooldown`, so a release is only
# proposed once it has been public that long. The threat is a
# publish-then-withdraw: a hijacked maintainer account ships a release and
# it is yanked once someone notices.
#
# Security updates are unaffected by the cooldown. GitHub's reference is
# explicit that `cooldown` "is only available for version updates, not
# security updates", so a dependency with a known vulnerability is still raised
# immediately. CI's osv-scanner job is the backstop regardless.
# ==================================================================

version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    # `widen` leaves declared floors alone; on a new major it raises the upper bound. The
    # default can take the project for an app and raise every floor. The strategy applies to
    # security updates too, so a floor is raised by hand, naming the advisory.
    versioning-strategy: widen
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"

  # Hook revisions are pinned by commit SHA with a version comment, like the
  # actions; without this they are never proposed for update.
  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
