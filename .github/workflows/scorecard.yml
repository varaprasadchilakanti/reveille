# ==================================================================
# Reveille -- OpenSSF Scorecard
#
# Runs on every push to main and weekly on Monday. Scores the
# repository security posture across branch protection, CI coverage,
# dependency pinning, vulnerability disclosure, and code review
# enforcement. Publishes results to the Security tab and to the
# OpenSSF API, enabling the Scorecard badge.
# ==================================================================

name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

# No token rights unless a job asks for them: every job below declares its
# own, and a job added later without a block starts with none.
permissions: {}

jobs:
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload results to Security tab
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: scorecard-results.sarif
