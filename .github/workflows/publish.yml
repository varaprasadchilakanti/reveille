# ==================================================================
# Reveille -- PyPI Publish Workflow
#
# Triggered on every tag push matching v*. Builds the distribution
# packages and publishes to PyPI via OIDC trusted publisher,
# requiring no stored credentials.
#
# Prerequisites:
#   1. A trusted publisher configured on pypi.org pointing at this
#      workflow file with environment name "pypi".
#   2. A "pypi" environment created in this repository's Settings.
# ==================================================================

name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/reveille/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
        with:
          version: "1.8.2"
          virtualenvs-in-project: true

      - name: Build distribution packages
        run: poetry build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
