# .github/workflows/cla.yml
#
# Verifies two things on every pull request, and stores nothing:
#   1. the contributor-agreement checkbox in the PR body is ticked, and names
#      the CLA version this repository currently requires;
#   2. every commit in the PR carries a Signed-off-by trailer (DCO 1.1).
#
# It writes no file, commits nothing, and calls no third-party service. The
# evidence of acceptance is the pull request and the commit trailers
# themselves -- data the contributor already published. That is deliberate:
# a committed signatures file would turn a name-and-email register into a
# filing system the maintainer controls.

name: cla

# 'pull_request' (not 'pull_request_target') is deliberate: fork pull requests
# then run with a read-only token and no access to repository secrets, so
# checking out the contributor's head commit here is safe.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

env:
  CLA_VERSION: "1.0"

jobs:
  agreement:
    name: contributor agreement
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkbox is ticked for the current CLA version
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          body = os.environ.get("PR_BODY") or ""
          version = os.environ["CLA_VERSION"]
          # Scoped to a single markdown list item: the ticked bullet line plus
          # its indented continuation lines. The version must appear inside the
          # SAME item as the tick.
          #
          # Two failure modes this walks between. Matching the whole body with
          # re.DOTALL let any ticked box anywhere -- "[x] I ran the tests" --
          # pass as long as the CLA string appeared later, even inside a code
          # fence; that is not evidence of acceptance. But requiring both on one
          # physical line was worse in practice: the shipped pull-request
          # template wraps that bullet across three lines, so the gate could
          # never pass, and told the contributor to tick a box they had ticked.
          # An item ends at the next bullet or at the next unindented line, so a
          # following paragraph cannot lend its text to the tick.
          #
          # tests/unit/test_cla_gate.py runs this script against the shipped
          # template, so the gate and the template cannot drift apart again.
          body = re.sub(r"<!--.*?-->", "", body, flags=re.DOTALL)
          item = re.compile(
              r"^[ \t]*[-*][ \t]+\[[xX]\][^\n]*(?:\n[ \t]+[^\n]*)*",
              re.MULTILINE,
          )
          token = "Reveille-CLA-" + version
          if any(token in m.group(0) for m in item.finditer(body)):
              print(f"Contributor Licence Agreement {version} accepted in the pull request body.")
              sys.exit(0)
          print(
              "The contributor-agreement checkbox is not ticked, or names a "
              f"version other than {version}.\n\n"
              "Read CLA.md, then edit the pull request description and tick the box in the "
              "'Contributor Licence Agreement' section. Do not edit the wording of that line."
          )
          sys.exit(1)
          PY

      - name: Checkout the pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # base.sha can be stale if the base branch moved; use the merge base.
          BASE="$(git merge-base "$BASE" "$HEAD")"
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys

          base, head = os.environ["BASE"], os.environ["HEAD"]

          def git(*args: str) -> str:
              return subprocess.run(
                  ["git", *args], capture_output=True, text=True, check=True
              ).stdout

          shas = git("rev-list", "--no-merges", f"{base}..{head}").split()
          messages = {sha: git("log", "-1", "--format=%B", sha) for sha in shas}

          signed = re.compile(r"^Signed-off-by: .+ <.+@.+>$", re.MULTILINE | re.IGNORECASE)

          # A remediation commit signs off on behalf of an earlier commit that
          # cannot carry a trailer of its own. This is the mechanism the DCO
          # app documents, and it exists for a real case: a commit made through
          # the GitHub web interface -- applying a review suggestion, accepting
          # a CodeQL autofix, editing a file in the browser -- has no way to add
          # one, and rewriting pushed history to insert it is worse than
          # recording the certification separately.
          #
          # The declaration must name the full SHA and must itself be signed
          # off, so the certification is still made by a person, in writing,
          # against a specific commit.
          # Whitespace-tolerant, because a commit message wraps. Requiring
          # the declaration on one physical line is the defect this release
          # already fixed once in the checkbox check above: the template a
          # contributor is told to copy did not fit on one line, so the gate
          # could never match what it asked for. \s matches a newline, so
          # the declaration may wrap anywhere between its words. The
          # forty-character SHA terminates it, so no end anchor is needed.
          remediation = re.compile(
              r"I,\s+.+?\s+<[^<>@\s]+@[^<>\s]+>,\s+hereby\s+add\s+my"
              r"\s+Signed-off-by\s+to\s+this\s+commit:\s+([0-9a-f]{40})",
              re.IGNORECASE,
          )
          remediated = {
              match.group(1).lower()
              for message in messages.values()
              if signed.search(message)
              for match in remediation.finditer(message)
          }

          missing = [
              sha
              for sha in shas
              if not signed.search(messages[sha]) and sha.lower() not in remediated
          ]

          for sha in missing:
              subject = git("log", "-1", "--format=%h %s", sha).strip()
              print(f"::error::missing Signed-off-by trailer: {subject}")

          if missing:
              print()
              print("Sign off your commits with 'git commit --signoff'.")
              print(f"To fix your own unpushed commits: git rebase --signoff {base}")
              print()
              print("For a commit made through the GitHub web interface, which")
              print("cannot carry a trailer, add a remediation commit instead:")
              print()
              print("    I, Your Name <you@example.com>, hereby add my")
              print(f"    Signed-off-by to this commit: {missing[0]}")
              print()
              print("    Signed-off-by: Your Name <you@example.com>")
              print()
              print("Turning on Settings > Commits > 'Require contributors to sign")
              print("off on web-based commits' stops this recurring.")
              sys.exit(1)

          print(f"All {len(shas)} commits are signed off.")
          PY
