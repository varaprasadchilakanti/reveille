# ==================================================================
# Reveille -- Continuous Integration
#
# Runs on every push and pull request targeting main.
#
# `lockfile` runs first and the other three depend on it: if poetry.lock
# cannot be parsed, every job that installs from it fails with an error that
# names the symptom rather than the cause. lint, typecheck and test then run
# in parallel, and all four must pass before a PR is eligible to merge.
# ==================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch makes the first run's result irrelevant.
# Cancelling it frees a runner and removes a stale red/green signal from the
# PR. `github.ref` keys per branch, so main and each PR queue independently.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No token rights unless a job asks for them: every job below declares its
# own, and a job added later without a block starts with none.
permissions: {}

jobs:

  # ----------------------------------------------------------------
  # Lock file integrity
  #
  # Runs first, and every other job depends on it. `poetry.lock` is
  # generated TOML: on 2026-09-02 a hand-resolved merge conflict
  # duplicated four keys in it, which is a syntax error, and every job
  # below failed with "Unable to read the lock file" -- an error that
  # says nothing about the actual cause.
  #
  # This job deliberately uses nothing but the standard library, so the
  # gate does not depend on the thing it is gating: if the lock is
  # broken, Poetry cannot install, so a check that needs Poetry to run
  # would never report.
  # ----------------------------------------------------------------
  lockfile:
    name: Lock file integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Validate poetry.lock
        run: make check-lock

  # Workflow correctness
  #
  # actionlint is a pre-commit hook, but a hook runs only for developers
  # who installed the git hooks locally. This job runs it on the server, so
  # the check does not depend on each contributor's setup.
  #
  # It runs through pre-commit rather than a separately downloaded binary
  # so the version stays pinned in one place, `.pre-commit-config.yaml`.
  # Complements zizmor rather than duplicating it: zizmor analyses
  # security posture, actionlint analyses correctness -- unknown contexts,
  # malformed matrices, expression type errors, and shellcheck over `run:`
  # blocks.
  # ----------------------------------------------------------------
  workflows:
    name: Workflow correctness (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lockfile
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check --require-hashes -r .github/requirements/pre-commit.txt
      - name: Run actionlint
        run: pre-commit run actionlint --all-files --show-diff-on-failure
      # The repository-hygiene hooks otherwise run only where a contributor
      # installed pre-commit.
      - name: Run hygiene hooks
        run: |
          for hook in trailing-whitespace end-of-file-fixer check-yaml check-case-conflict \
              check-merge-conflict detect-private-key; do
            pre-commit run "$hook" --all-files --show-diff-on-failure
          done

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lockfile
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: "2.4.2"
          virtualenvs-in-project: true
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Run ruff
        run: make lint
      - name: Check formatting
        run: make format-check
      - name: Check version sync
        run: make check-version
      - name: Check licence declarations agree
        run: make check-licence
      - name: Check poetry.lock agrees with pyproject.toml
        run: make check-lock-sync
      - name: Check packaging contract
        run: make check-packaging

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lockfile
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: "2.4.2"
          virtualenvs-in-project: true
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Run mypy
        run: make typecheck

  # ----------------------------------------------------------------
  # What a pull request changes
  #
  # A change to documentation alone (Markdown, llms.txt, PNG and SVG
  # images outside src/ and tests/) needs one run of the suite, not every
  # interpreter on every system. It runs on Linux 3.11, the leg that
  # uploads coverage; the others report success with every step skipped.
  # The guards are per step, not a job-level `if`: that cannot read
  # `matrix`, and a skipped matrix job leaves its required check pending. A push to main, a list Git cannot
  # give, or this job failing runs everything.
  # ----------------------------------------------------------------
  changes:
    name: What changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 .github/scripts/changed_code.py "$BASE"

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lockfile, changes]
    # Runs if `changes` failed, and then tests everything: a skipped job would count as passed.
    if: ${{ !cancelled() && needs.lockfile.result == 'success' }}
    env:
      RUN_TESTS: ${{ needs.changes.outputs.code != 'false' || matrix.python-version == '3.11' }}
    permissions:
      contents: read
    strategy:
      # Report every failing interpreter, not just the first. When a new
      # CPython is added to the matrix, knowing whether it broke alone or
      # alongside others is the whole diagnostic.
      fail-fast: false
      matrix:
        # Every non-EOL CPython at or above Reveille's 3.11 floor.
        # See CONTRIBUTING.md, "Supported Python versions".
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_TESTS == 'true'
        with:
          # tests/integration/test_mailmap_file.py runs `git shortlog` over this
          # repository's real history, to assert that Git itself -- not just
          # Reveille's more forgiving parser -- folds the maintainer's
          # aliases. At the default depth of 1 the only visible commit is the
          # merge ref, whose parents are grafted away, so the check sees
          # exactly one author: whoever wrote the head commit. For a human
          # pull request that happens to be the maintainer and the assertion
          # passes by accident; for a Dependabot pull request it is
          # `dependabot[bot]` and the assertion fails, blocking a bot pull
          # request on a property of the repository it did not change.
          #
          # The full history is 505 commits in a 1.5 MiB pack, so this is a
          # few hundred milliseconds per leg, not a tradeoff.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: env.RUN_TESTS == 'true'
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        if: env.RUN_TESTS == 'true'
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: "2.4.2"
          virtualenvs-in-project: true
      - name: Install dependencies
        if: env.RUN_TESTS == 'true'
        run: poetry install --no-interaction
      - name: Run pytest
        if: env.RUN_TESTS == 'true'
        run: poetry run pytest -n auto --timeout=120 --cov=reveille --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: env.RUN_TESTS == 'true' && matrix.python-version == '3.11'
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ----------------------------------------------------------------
  # Windows and macOS
  #
  # pyproject.toml classifies the package "OS Independent". Windows has no
  # O_NOFOLLOW, no dir_fd and no SIGHUP, and macOS's default file system
  # ignores case, so each is tested, not assumed. The lowest and highest
  # supported CPython on each keep the leg count at four. A separate job,
  # so the Linux legs keep their check names.
  # ----------------------------------------------------------------
  test-other-os:
    name: Test on ${{ matrix.os }} (pytest) (${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [lockfile, changes]
    if: ${{ !cancelled() && needs.lockfile.result == 'success' }}
    env:
      RUN_TESTS: ${{ needs.changes.outputs.code != 'false' }}
    permissions:
      contents: read
    defaults:
      run:
        # snok/install-poetry needs bash on Windows; the runner has Git Bash.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_TESTS == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: env.RUN_TESTS == 'true'
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        if: env.RUN_TESTS == 'true'
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: "2.4.2"
          virtualenvs-in-project: true
      - name: Install dependencies
        if: env.RUN_TESTS == 'true'
        run: poetry install --no-interaction
      - name: Run pytest
        if: env.RUN_TESTS == 'true'
        # The slowest tests are listed, to show where these legs' minutes go.
        run: poetry run pytest -n auto --timeout=120 --durations=25 --junitxml=pytest.xml
      - name: Group the failures by cause
        if: failure() && env.RUN_TESTS == 'true'
        run: python .github/scripts/test_failures.py pytest.xml --annotate

  # ----------------------------------------------------------------
  # Known vulnerabilities in the resolved dependency set
  #
  # Not redundant with Dependabot, for a structural reason rather than a
  # data one: Dependabot alerts are a platform service that scans the
  # default branch asynchronously. They cannot be invoked as a step and
  # therefore cannot block anything. This can, and the same scan gates
  # the release in publish.yml.
  #
  # osv-scanner reads poetry.lock directly.
  # ----------------------------------------------------------------
  vulnerabilities:
    name: Known vulnerabilities (osv-scanner)
    needs: lockfile
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --lockfile=poetry.lock

  # ----------------------------------------------------------------
  # Build reproducibility
  #
  # SOURCE_DATE_EPOCH is set here: on the pinned Poetry 2.4.2, wheel entry
  # timestamps track it.
  #
  # The epoch is derived from the analysed commit, the same convention the
  # `--deterministic` report flag uses, so a build and a report generated
  # from one commit agree on what "now" means.
  #
  # The check still builds twice and compares rather than trusting the
  # mechanism. Poetry falls back to a fixed date when the variable is
  # absent, so a build can be reproducible for the wrong reason; only
  # comparing two builds shows whether the property actually holds.
  # ----------------------------------------------------------------
  reproducible-build:
    name: Reproducible build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lockfile
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: "2.4.2"
          virtualenvs-in-project: true
      - name: Derive SOURCE_DATE_EPOCH from the analysed commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build twice and compare
        run: |
          set -euo pipefail
          rm -rf dist && poetry build -q && mkdir -p /tmp/b1 && cp dist/* /tmp/b1/
          rm -rf dist && poetry build -q && mkdir -p /tmp/b2 && cp dist/* /tmp/b2/
          (cd /tmp/b1 && sha256sum ./*) > /tmp/sums1
          (cd /tmp/b2 && sha256sum ./*) > /tmp/sums2
          if diff /tmp/sums1 /tmp/sums2; then
            echo "Build is reproducible."
          else
            echo "::error::Two builds of the same commit produced different bytes."
            exit 1
          fi
